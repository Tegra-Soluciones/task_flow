[project]
name = "task_flow"
authors = [
    { name = "Yelke", email = "dev@yelke.com" }
]
description = "Gestión de tareas y proyectos — SPA sobre ERPNext v15"
requires-python = ">=3.10"
readme = "README.md"
version = "0.1.0"
dependencies = [
    # "frappe~=15.0.0"  # managed by bench
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.bench.dev-dependencies]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "B017", "B018", "B023", "B904",
    "E101", "E402", "E501", "E741",
    "F401", "F403", "F405", "F722",
    "W191",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
